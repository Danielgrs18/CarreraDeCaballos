name: carrera_caballos
description: "Carrera de caballos con baraja española."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  wakelock_plus: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    # El favicon de verdad sale a 16x16, donde el anillo y los agujeros de
    # la versión normal se emborronan: usa un trazo aparte, más grueso y
    # sin detalles finos.
    image_path: "assets/icon/favicon_fuente.png"
    background_color: "#0E5A38"
    theme_color: "#0E5A38"
  image_path: "assets/icon/maestro.png"
  adaptive_icon_background: "assets/icon/fondo.png"
  adaptive_icon_foreground: "assets/icon/frente.png"
  min_sdk_android: 21
  remove_alpha_ios: true
