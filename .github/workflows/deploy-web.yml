# Compila la app a web y la publica en GitHub Pages en cada push a main.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, que solo se publique el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versión fija en vez de "stable": así una nueva versión de Flutter no
      # puede romper la publicación por sorpresa con avisos nuevos.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test --exclude-tags capturas

      # En Pages la app cuelga de /<nombre-del-repo>/, no de la raíz.
      - name: Compilar web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
